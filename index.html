<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый лендинг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            animation: slideIn 0.8s ease-out;
        }

        .hero .subtitle {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.95;
            animation: slideIn 0.8s ease-out 0.2s both;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            animation: slideIn 0.8s ease-out 0.4s both;
        }

        .feature {
            background: rgba(255, 255, 255, 0.15);
            padding: 20px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feature p {
            font-size: 0.95rem;
        }

        .cta-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px 30px;
            border-radius: 15px;
            max-width: 500px;
            animation: slideIn 0.8s ease-out 0.6s both;
        }

        .cta-section h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            transition: box-shadow 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        input[type="email"]::placeholder {
            color: #999;
        }

        .btn {
            width: 100%;
            padding: 14px 30px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .success-message {
            display: none;
            background: rgba(76, 222, 128, 0.2);
            border: 2px solid #4cde80;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero .subtitle {
                font-size: 1.1rem;
            }

            .features {
                gap: 15px;
            }

            .feature {
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1>🚀 Добро пожаловать!</h1>
        <p class="subtitle">Мой первый лендинг — результат работы с Git и GitHub</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <p>Быстро</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <p>Безопасно</p>
            </div>
            <div class="feature">
                <div class="feature-icon">💪</div>
                <p>Мощно</p>
            </div>
        </div>

        <div class="cta-section">
            <h2>Хочешь узнать больше?</h2>
            <form id="emailForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <input 
                        type="email" 
                        placeholder="Введи свой email..." 
                        required
                    >
                </div>
                <button type="submit" class="btn">Узнать больше</button>
                <button type="button" class="btn btn-secondary" onclick="handleSkip()">
                    Пока нет, спасибо
                </button>
            </form>
            <div class="success-message" id="successMsg">
                ✅ Спасибо! Мы отправим информацию на твой email
            </div>
        </div>
    </section>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const input = event.target.querySelector('input[type="email"]');
            const email = input.value;
            
            event.target.style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
            
            console.log('Email подписки:', email);
        }

        function handleSkip() {
            alert('Вернись когда будешь готов! 😊');
        }
    </script>
</body>
</html>
